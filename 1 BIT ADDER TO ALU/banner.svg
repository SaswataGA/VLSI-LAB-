<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">8-bit ALU banner</title><desc id="d">A large NAND gate symbol and a build chain NAND, XOR, full adder, 8-bit adder, latch, register, ALU that lights up one block at a time.</desc><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#13263f" stroke-width="1"/></pattern></defs><rect width="1200" height="300" rx="14" fill="#0d1b2e"/><rect width="1200" height="300" rx="14" fill="url(#g)"/><rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="13.5" fill="none" stroke="#27456b" stroke-width="1.5"/><path d="M905,58 H961 A46,46 0 0 1 961,150 H905 Z" fill="#102641" stroke="#ffb81c" stroke-width="4.5" stroke-linejoin="round"/><circle cx="1016" cy="104" r="9" fill="#102641" stroke="#ffb81c" stroke-width="4.5"/><line x1="815" y1="81" x2="905" y2="81" stroke="#ffb81c" stroke-width="4.5" stroke-linecap="round"/><line x1="815" y1="127" x2="905" y2="127" stroke="#4d78b5" stroke-width="4.5" stroke-linecap="round"/><line x1="1025" y1="104" x2="1150" y2="104" stroke="#ffb81c" stroke-width="4.5" stroke-linecap="round"/><text x="800" y="86" font-size="18" fill="#8aa3c4" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">A</text><text x="800" y="132" font-size="18" fill="#8aa3c4" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">B</text><text x="1160" y="110" font-size="18" fill="#8aa3c4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Y</text><text x="945" y="184" font-size="17" fill="#8aa3c4" text-anchor="middle" font-weight="600" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">NAND</t